let savedCar = localStorage.getItem("dailyCar");


if(savedDate === today && savedCar){

return cars.find(c => c.name === savedCar);

}



let history = JSON.parse(
localStorage.getItem("featuredCars")
) || [];



let available = cars.filter(car =>
!history.includes(car.name)
);



if(available.length === 0){

history=[];

available=[...cars];

}



let randomIndex =
Math.floor(Math.random()*available.length);



let selected = available[randomIndex];



history.push(selected.name);



localStorage.setItem(
"featuredCars",
JSON.stringify(history)
);



localStorage.setItem(
"dailyDate",
today
);



localStorage.setItem(
"dailyCar",
selected.name
);



return selected;


}

car.category === "Hypercar" ||
car.category === "Supercar" ||
car.category === "Race Cars / Track Cars"
);



let usedCars =
JSON.parse(
localStorage.getItem("guessUsedCars")
) || [];


let availableCars =
cars.filter(car =>
!usedCars.includes(car.name)
);



if(availableCars.length < 50){

usedCars=[];

availableCars=[...cars];

}



guessGameCars =
availableCars
.sort(()=>Math.random()-0.5)
.slice(0,50);



guessGameCars.forEach(car=>{

usedCars.push(car.name);

});


localStorage.setItem(
"guessUsedCars",
JSON.stringify(usedCars)
);

// reset display

document.getElementById("guessResult")?.remove();


// start

loadGuessRound();

}

function getGuessOptions(correctCar){

let options=[correctCar];


let pool=cars.filter(car=>

car.name !== correctCar.name &&

Math.abs(car.hp - correctCar.hp) < 500

);



pool=pool.sort(()=>Math.random()-0.5);



while(options.length < 5 && pool.length){

let car = pool.pop();

if(!options.includes(car)){

options.push(car);

}

}



while(options.length < 5){

let random = cars[Math.floor(Math.random()*cars.length)];


if(!options.includes(random)){

options.push(random);

}

}



return options.sort(()=>Math.random()-0.5);


}

 let wrongSound = new Audio("sounds/wrong.mp3");

function startCounters(){

document.querySelectorAll(".counter").forEach(counter=>{

let target=parseFloat(counter.dataset.target);

let current=0;

let increment=target/60;


let timer=setInterval(()=>{

current+=increment;


if(current>=target){

current=target;

clearInterval(timer);

}


if(target % 1 !== 0){

counter.innerHTML=current.toFixed(1);

}

else{

counter.innerHTML=Math.floor(current);

}


},20);


});


}

function startDailyCountdown(){

clearInterval(window.dailyTimerInterval);

window.dailyTimerInterval=setInterval(()=>{

const now=new Date();

const tomorrow=new Date();

tomorrow.setHours(24,0,0,0);

let diff=tomorrow-now;

let hours=Math.floor(diff/3600000);

let minutes=Math.floor((diff%3600000)/60000);

let seconds=Math.floor((diff%60000)/1000);

document.getElementById("dailyTimer").innerHTML=

String(hours).padStart(2,"0")+":"+

String(minutes).padStart(2,"0")+":"+

String(seconds).padStart(2,"0");

},1000);

}
